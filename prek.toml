# Canonical git-hook configuration for this repository (prek).
# One config at the root; do not add per-package hook configs.
# See https://prek.j178.dev — refresh pins with `prek auto-update`.
#:schema https://www.schemastore.org/prek.json

# Keep build artifacts and vendored content out of every hook.
exclude = { glob = ["target/**", "tests/stubs/**"] }

# ── hygiene: native builtins, no environment setup ───────────────────────────
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", args = [
    "--markdown-linebreak-ext=md",
  ] },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending", args = [
    "--fix=lf",
  ] },
  { id = "check-yaml" },
  { id = "check-json" },
  { id = "check-toml" },
  { id = "check-merge-conflict" },
  { id = "check-case-conflict" },
  { id = "check-added-large-files", args = [
    "--maxkb=1024",
  ] },
  { id = "detect-private-key" },
]

# ── secrets: required in every repository ────────────────────────────────────
[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [{ id = "gitleaks" }]

# ── docs ─────────────────────────────────────────────────────────────────────
[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "v0.2.73"
hooks = [{ id = "rumdl" }, { id = "rumdl-fmt" }]

# ── spelling ─────────────────────────────────────────────────────────────────
[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.50.1"
hooks = [{ id = "typos" }]

# ── rust: fast staged-file checks. Full build/test lives in `just ci`. ────────
[[repos]]
repo = "local"
hooks = [
  { id = "rustfmt", name = "rustfmt", entry = "cargo fmt --check", language = "system", types = [
    "rust",
  ], pass_filenames = false },
]
